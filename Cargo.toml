[package]
name = "titan_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cxx = "1.0"
once_cell = "1.18"
# Serialization and Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time manipulation and Precision Time Protocol
chrono = "0.4"
# Data integrity validation
crc32fast = "1.3"

# Protobuf for Consumer-Agnostic IPC payload
prost = "0.13"
bytes = "1"

# Random generation for Session UUIDs
uuid = { version = "1.8", features = ["v4"] }

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"
md5 = "0.7"
prost-build = "0.13"
